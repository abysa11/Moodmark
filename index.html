<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Moodmark — дневник, который помнит, как ощущался день</title>
  <meta name="description" content="Moodmark превращает день — текст, фото и песню — в воспоминание, которое можно снова прожить: фото раскрывается во весь экран, звучит песня того дня.">
  <meta name="theme-color" content="#3d9be3">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Moodmark — дневник, который помнит, как ощущался день">
  <meta property="og:description" content="Текст, фото и песня дня превращаются в воспоминание, к которому хочется вернуться.">
  <meta property="og:image" content="assets/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body class="is-intro">
  <!-- fluffy cloud edges: fractal noise pushes the edges of soft blobs around -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="cf1" x="-50%" y="-50%" width="200%" height="200%"><feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="4" seed="3"/><feDisplacementMap in="SourceGraphic" scale="120"/></filter>
    <filter id="cf2" x="-50%" y="-50%" width="200%" height="200%"><feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="4" seed="11"/><feDisplacementMap in="SourceGraphic" scale="90"/></filter>
    <filter id="cf3" x="-50%" y="-50%" width="200%" height="200%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="27"/><feDisplacementMap in="SourceGraphic" scale="60"/></filter>
  </svg>
  <div id="intro" aria-hidden="true">
    <div class="sky2">
      <div class="clouds far"><div class="cloud c1"><i></i><i></i><i></i></div><div class="cloud c2"><i></i><i></i><i></i></div><div class="cloud c3"><i></i><i></i><i></i></div><div class="cloud c4"><i></i><i></i><i></i></div></div>
      <div class="clouds mid"><div class="cloud c1"><i></i><i></i><i></i></div><div class="cloud c2"><i></i><i></i><i></i></div><div class="cloud c3"><i></i><i></i><i></i></div></div>
      <div class="clouds near"><div class="cloud c1"><i></i><i></i><i></i></div><div class="cloud c2"><i></i><i></i><i></i></div><div class="cloud c3"><i></i><i></i><i></i></div></div>
      <div class="bubbles"></div>
    </div>
    <div class="intro-logo"><span class="logo-bubble"><span class="logo"></span></span></div>
    <p class="intro-name">Moodmark</p>
    <p class="intro-skip">Нажмите, чтобы пропустить</p>
  </div>
  <div class="backdrop" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div id="app"></div>
  <noscript>Moodmark работает в браузере с включённым JavaScript.</noscript>
</body>
</html>
