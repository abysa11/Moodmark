<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moodmark — дневник, который помнит, как ощущался день</title>
  <meta name="description" content="Напишите пару строк о дне, добавьте фото и песню. Moodmark соберёт из них живое воспоминание с музыкой, палитрой и ритмом этого дня.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Moodmark — дневник, который помнит, как ощущался день">
  <meta property="og:description" content="Текст, фото и песня дня превращаются в воспоминание, которое передаёт его атмосферу.">
  <meta property="og:image" content="assets/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Caveat:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=8">
  <script>document.documentElement.dataset.sidebar = innerWidth < 900 ? 'closed' : (localStorage.getItem('mm-sidebar') || 'open'); document.documentElement.classList.add('no-anim'); addEventListener('load', () => setTimeout(() => document.documentElement.classList.remove('no-anim'), 50));</script>
</head>
<body>
  <a class="skip" href="#main">К содержимому</a>

  <aside class="sidebar" id="sidebar" aria-label="Дневник">
    <div class="sidebar__head">
      <a class="brand" href="#/" aria-label="Moodmark — все дни">
        <svg class="brand__mark" viewBox="0 0 400 520" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M0 52Q0 0 52 0H348Q400 0 400 52V494Q400 520 378 507L214 404Q200 395 186 404L22 507Q0 520 0 494ZM66 58Q48 58 48 76V288C80 290 120 290 150 275C200 250 230 188 270 166C300 150 330 162 352 183V76Q352 58 334 58Z"/></svg>
        <span class="brand__word">Moodmark</span>
      </a>
      <button class="btn btn--invisible btn--icon btn--sm" type="button" data-toggle-sidebar aria-label="Скрыть панель" aria-controls="sidebar">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.75" y="2.25" width="12.5" height="11.5" rx="2"/><path d="M6 2.5v11"/></svg>
      </button>
    </div>

    <a class="btn btn--primary btn--block" href="#/new" data-nav="new">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
      <span>Новый день</span>
    </a>

    <nav class="side-nav" aria-label="Разделы">
      <a href="#/" data-nav="archive">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
        <span>Все дни</span><span class="side-nav__count mono" id="side-count"></span>
      </a>
    </nav>

    <div class="sidebar__group">
      <div class="sidebar__label-row">
        <p class="sidebar__label">Папки</p>
        <button class="btn btn--invisible btn--icon btn--sm" type="button" id="new-folder" aria-label="Новая папка" title="Новая папка">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
        </button>
      </div>
      <ul class="folders folders--collections" id="collections"></ul>
    </div>

    <div class="sidebar__section">
      <p class="sidebar__label">Дни</p>
      <ul class="folders" id="folders" aria-live="polite">
        <li><span class="skeleton skeleton--line"></span></li>
        <li><span class="skeleton skeleton--line"></span></li>
        <li><span class="skeleton skeleton--line"></span></li>
      </ul>
    </div>

    <div class="sidebar__foot">
      <button class="btn btn--invisible btn--sm btn--block-left" type="button" id="reseed">
        <span class="spinner" aria-hidden="true"></span>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2.5 8a5.5 5.5 0 1 0 1.7-4M2.5 2.5v3h3"/></svg>
        <span>Вернуть демо-дни</span>
      </button>
      <p class="sidebar__legal">EmptyHeads</p>
    </div>
  </aside>
  <div class="scrim" data-toggle-sidebar aria-hidden="true"></div>

  <div class="workspace">
    <div class="topbar">
      <button class="btn btn--icon btn--sm topbar__toggle" type="button" data-toggle-sidebar aria-label="Показать панель" aria-controls="sidebar">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.75" y="2.25" width="12.5" height="11.5" rx="2"/><path d="M6 2.5v11"/></svg>
      </button>
      <a class="brand topbar__brand" href="#/" aria-label="Moodmark — все дни">
        <svg class="brand__mark" viewBox="0 0 400 520" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M0 52Q0 0 52 0H348Q400 0 400 52V494Q400 520 378 507L214 404Q200 395 186 404L22 507Q0 520 0 494ZM66 58Q48 58 48 76V288C80 290 120 290 150 275C200 250 230 188 270 166C300 150 330 162 352 183V76Q352 58 334 58Z"/></svg>
        <span class="brand__word">Moodmark</span>
      </a>
      <nav class="crumbs" id="crumbs" aria-label="Где вы"></nav>
    </div>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="js/app.js?v=7"></script>
</body>
</html>
